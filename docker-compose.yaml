services:
  db:
    image: postgres:16
    container_name: postgres-tutorial-odoo19
    env_file: .env
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - PGDATA=${PGDATA}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # shared_buffers 25% de la RAM effective_cache_size 75% de la RAM
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=top
      -c default_statistics_target=100
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c lock_timeout=60s
      -c idle_in_transaction_session_timeout=10min
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c min_wal_size=128MB
      -c max_wal_size=1GB
    networks:
      - tutorial-odoo-local
  web:
    build: .
    depends_on:
      - db
    container_name: tutorial-odoo19
    env_file: .env
    tty: true
    restart: unless-stopped
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
      - ./custom-addons:/mnt/custom-addons
      - ./odoo:/mnt/odoo
    ports:
      - "8069:8069"
      - "8071:8071"
      - "8072:8072"

    networks:
      - tutorial-odoo-local
volumes:
  odoo-data:
  db-data:
networks:
  tutorial-odoo-local: